<head>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1012;--surf:#17181b;--panel:#1d1f23;--deep:#0a0b0c;--border:#2c2f35;--muted:#16181b;--green:#6fb894;--blue:#7f9bc0;--amber:#d4a85c;--red:#d27068;--purple:#9b8fbf;--text:#ececed;--dim:#8b8f97;--dimmer:#4c5058;--accent:#e07856;--accent-deep:#c9613f}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surf)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:13px 24px;
  display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
#logo{font-family:'Hanken Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:.07em}
#logo span{color:var(--green)}
#sub{font-family:'Hanken Grotesk',monospace;font-size:11px;color:var(--dim);letter-spacing:.05em}
.vr{width:1px;height:20px;background:var(--border)}
#ha{margin-left:auto;display:flex;gap:8px}
.btn{padding:6px 16px;border-radius:6px;font-size:12px;font-weight:600;
  font-family:'Hanken Grotesk',sans-serif;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.82}
.bp{background:var(--green);color:#000}
.bg{background:transparent;border:1px solid var(--border);color:var(--dim)}
#main{max-width:1120px;margin:0 auto;padding:36px 24px}
.card{background:var(--surf);border:1px solid var(--border);border-radius:12px;padding:32px 36px}
.slbl{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.12em;margin-bottom:22px}
.step{display:flex;align-items:flex-start;gap:14px;padding:13px 0;border-bottom:1px solid var(--muted)}
.step:last-child{border-bottom:none}
.si{width:18px;flex-shrink:0;margin-top:2px;font-size:15px}
.sl{font-size:13px;color:var(--dim)}.sl.on{color:var(--text);font-weight:600}
.sn{font-family:'Hanken Grotesk',monospace;font-size:10px;color:var(--green);margin-top:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin 1.1s linear infinite;color:var(--amber)}
/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:var(--surf);border:1px solid var(--border);border-radius:8px;
  padding:10px 18px;display:flex;align-items:center;gap:10px}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cv{font-family:'Hanken Grotesk',monospace;font-size:20px;font-weight:500;line-height:1}
.cl{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.06em}
.sc{background:var(--surf);border:1px solid var(--border);border-radius:8px;
  padding:10px 16px;text-align:center;min-width:82px}
.sv{font-family:'Hanken Grotesk',monospace;font-size:24px;font-weight:500;line-height:1}
.sll{font-size:9px;color:var(--dim);letter-spacing:.1em;margin-top:5px}
/* mode banner */
.mode-banner{border-radius:8px;padding:12px 18px;margin-bottom:20px;font-size:13px;display:flex;align-items:center;gap:10px}
.mode-coords{background:rgba(127,155,192,.1);border:1px solid rgba(127,155,192,.3);color:var(--blue)}
.mode-geo{background:rgba(111,184,148,.08);border:1px solid rgba(111,184,148,.25);color:var(--green)}
/* col mapping */
.cmg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
@media(max-width:620px){.cmg{grid-template-columns:1fr}}
.cr{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--border);border-radius:8px;padding:10px 14px}
.ck{font-size:10px;font-weight:700;color:var(--dim);width:90px;flex-shrink:0;letter-spacing:.05em}
.cs{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:6px;
  padding:5px 10px;color:var(--text);font-family:'Hanken Grotesk',monospace;font-size:11px;cursor:pointer;outline:none}
.cs option{background:var(--panel)}.cs:focus{border-color:var(--green)}
.cok{color:var(--green);font-size:14px;flex-shrink:0}
.cwn{color:var(--amber);font-size:14px;flex-shrink:0}
.cdim{color:var(--dim);font-size:14px;flex-shrink:0}
/* preview */
.pvw{background:var(--panel);border:1px solid var(--border);border-radius:8px;
  overflow:auto;max-height:130px;margin-bottom:18px}
.pvw table{width:100%;border-collapse:collapse;font-size:11px}
.pvw th{padding:6px 12px;background:var(--muted);text-align:left;font-size:9px;color:var(--dim);
  letter-spacing:.08em;white-space:nowrap;font-weight:700;border-bottom:1px solid var(--border);position:sticky;top:0}
.pvw td{padding:5px 12px;border-bottom:1px solid var(--muted);
  font-family:'Hanken Grotesk',monospace;color:var(--dim);white-space:nowrap}
.pvw .hl{color:var(--text)}.pvw .mt{color:var(--red);font-size:10px}
/* progress */
.pt{background:var(--panel);border-radius:4px;height:6px;overflow:hidden;
  border:1px solid var(--border);margin-bottom:6px}
.pf{height:100%;background:linear-gradient(90deg,var(--green),#6fb894);border-radius:4px;transition:width .25s ease}
.pm{display:flex;justify-content:space-between;font-size:11px;font-family:'Hanken Grotesk',monospace;color:var(--dim)}
.pl{font-family:'Hanken Grotesk',monospace;font-size:11px;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:380px}
/* tabs */
.tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tab{padding:5px 13px;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;
  border:1px solid var(--border);background:transparent;color:var(--dim);transition:all .15s}
.tab.on{border-color:var(--green);background:rgba(111,184,148,.1);color:var(--green)}
.fc{margin-left:auto;font-size:11px;color:var(--dim)}
/* table */
.tw{background:var(--surf);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.ts{overflow-x:auto;max-height:480px;overflow-y:auto;scrollbar-width:auto;scrollbar-color:var(--green) var(--panel);scroll-behavior:smooth}
/* Chunky, easy-to-grab scrollbars for the results table specifically */
.ts::-webkit-scrollbar{width:16px;height:18px}
.ts::-webkit-scrollbar-track{background:var(--panel);border-radius:10px;border:1px solid var(--border)}
.ts::-webkit-scrollbar-thumb{background:var(--green);border-radius:10px;border:4px solid var(--panel);min-width:80px;min-height:60px;background-clip:padding-box}
.ts::-webkit-scrollbar-thumb:hover{background:#83c7a4;border-width:3px}
.ts::-webkit-scrollbar-thumb:active{background:#9ad6b7;border-width:2px}
.ts::-webkit-scrollbar-corner{background:var(--panel)}
table.rt{width:100%;border-collapse:collapse;font-size:12px}
table.rt thead tr{background:var(--panel);position:sticky;top:0;z-index:1}
table.rt th{padding:10px 14px;text-align:left;font-size:9px;font-weight:700;
  color:var(--dim);letter-spacing:.1em;white-space:nowrap;border-bottom:1px solid var(--border)}
table.rt td{padding:8px 14px;border-bottom:1px solid var(--muted)}
table.rt tbody tr:hover td{background:var(--panel)}
.dn{color:var(--text);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd{color:var(--dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dz{color:var(--dim);max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dpu{color:var(--dim);max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc{color:var(--dim);white-space:nowrap}.dm{font-family:'Hanken Grotesk',monospace;font-size:11px;color:var(--dim);white-space:nowrap}
.ok{font-size:11px;color:var(--green)}.fail{font-size:11px;color:var(--red)}
.bdg{display:inline-block;padding:2px 9px;border-radius:4px;font-size:10px;
  font-family:'Hanken Grotesk',monospace;font-weight:600;letter-spacing:.06em}
.warn{background:rgba(212,168,92,.08);border:1px solid rgba(212,168,92,.25);
  border-radius:8px;padding:11px 16px;margin-bottom:14px;font-size:12px;color:var(--amber)}
.ecard{background:var(--surf);border:1px solid rgba(210,112,104,.3);
  border-radius:12px;padding:32px 36px;max-width:520px;margin:60px auto}
.etitle{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.1em;margin-bottom:12px}
.foot{margin-top:12px;font-size:11px;color:var(--dim)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .3s ease}
</style>
<style id="reskin">
body{background-color:var(--bg);background-image:radial-gradient(110% 70% at 50% -15%, rgba(224,120,86,.04), transparent 60%);background-attachment:fixed;font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum" 1;font-feature-settings:"tnum" 1}

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
const QCT_URLS = [
  'https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/QUALIFIED_CENSUS_TRACTS_2026/FeatureServer/0',
  'https://services.arcgis.com/VTyQ9soqVukalItT/ArcGIS/rest/services/Qualified_Census_Tracts/FeatureServer/0',
  'https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Qualified_Census_Tracts_2026/FeatureServer/0',
];
const DDA_URLS = [
  'https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/DIFFICULT_DEVELOPMENT_AREAS_2026/FeatureServer/0',
  'https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Difficult_Development_Areas_2026/FeatureServer/0',
  'https://services.arcgis.com/VTyQ9soqVukalItT/arcgis/rest/services/Difficult_Development_Areas/FeatureServer/0',
];
// ESRI Living Atlas hosts ACS poverty data with CORS-friendly headers
// (the Census Data API does not, so it can't be called from file:// pages).
// Tract-level layer is /FeatureServer/2. Field B17020_calc_pctPovE is the
// pre-calculated "Percent of Population below poverty level" — exactly what
// the data.census.gov S1701 workflow surfaces. Auto-updates with each annual
// ACS 5-year release.
const POVERTY_URLS = [
  'https://services.arcgis.com/P3ePLMYs2RVChkJx/arcgis/rest/services/ACS_Poverty_by_Age_Boundaries/FeatureServer/2',
];
const POVERTY_FIELD = 'B17020_calc_pctPovE';
const CENSUS_GEO = 'https://geocoding.geo.census.gov/geocoder/geographies/onelineaddress';
const FCC_API    = 'https://geo.fcc.gov/api/census/block/find';

// ── CENSUS DATA API (authoritative — matches data.census.gov exactly) ────────
// S1701 is the Subject Table data.census.gov surfaces for poverty. Variable
// S1701_C03_001E IS the published "Percent below poverty level" for the whole
// "population for whom poverty status is determined" — i.e. the exact number you
// read off data.census.gov. We pull it by tract GEOID for an explicit ACS 5-year
// release, so the scanner can match the site release-for-release.
// NOTE: As of 2026-05-12 the Census API requires a free key on EVERY request
// (https://api.census.gov/data/key_signup.html). Without a key, or if the call
// fails (e.g. a file:// page the browser blocks on CORS), the scanner falls back
// to the ESRI Living Atlas by-GEOID lookup below.
const CENSUS_API       = 'https://api.census.gov/data';
const CENSUS_DATASET   = 'acs/acs5/subject';
const CENSUS_PCT_VAR   = 'S1701_C03_001E';     // % below poverty (published)
const CENSUS_DEFAULT_YEAR = 2024;              // latest ACS 5-year release (2020–2024)

const ALIASES = {
  name:    ['property name','name','property','listing name','title'],
  street:  ['street','address','property address','street address','addr','full address','location'],
  city:    ['city','city name','municipality','town'],
  state:   ['state','state/province','st','province','state code'],
  zip:     ['zip','zip code','zipcode','postal code','postalcode','zip_code','postal','postcode'],
  lat:     ['latitude','lat','y','y_coord','lat_coord','latitude_dd','lat_wgs84','property latitude'],
  lon:     ['longitude','lon','lng','x','x_coord','lon_coord','lng_coord','longitude_dd','lon_wgs84','long','property longitude'],
  acres:   ['acres','acreage','lot size','lot size acres','lot size (acres)','land area','land area (ac)','land area (acres)','land area ac','property size','land size','lot acres','total acres','site size'],
  price:   ['for sale price','sale price','price','asking price','list price','listing price','sales price','price ($)'],
  county:  ['county','county name','parish','borough'],
  zoning:  ['zoning','zone','zoning code','zoning classification','zoning class','current zoning','existing zoning','property zoning','zoning district','zone code','zone class','zoning type'],
  propuse: ['proposed use','proposed land use','proposed uses','proposed use(s)','proposed land uses','proposeduse','proposed development','intended use','planned use','land use','permitted use'],
};

// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
  phase: 'init',   // init|ready|mapping|processing|done|error
  steps: [
    {id:'qct',     label:'Locating QCT 2026 service',      st:'wait', note:''},
    {id:'dda',     label:'Locating DDA 2026 service',      st:'wait', note:''},
    {id:'poverty', label:'Locating ACS Poverty service',   st:'wait', note:''},
  ],
  qctUrl: null, ddaUrl: null, povertyUrl: null,  // confirmed ArcGIS service URLs
  qctSet: null,                      // Set<geoid> — only loaded in geocoding mode
  csvRows:[], csvCols:[], colMap:{},
  censusKey:'',                      // optional Census Data API key (required by census.gov as of 2026-05-12)
  censusYear: CENSUS_DEFAULT_YEAR,   // ACS 5-year release to match data.census.gov (latest by default)
  results:[], warnings:[], filter:'all', sort:null,  // sort: null | {key:'poverty'|'acres', dir:'asc'|'desc'}
  prog:{n:0,total:0,label:'',eta:''},
  initErr:'',
};

// ── UTILS ─────────────────────────────────────────────────────────────────────
const sleep = ms => new Promise(r => setTimeout(r, ms));
const to = (ms,p) => Promise.race([p, new Promise((_,r) => setTimeout(() => r(new Error('Timeout')), ms))]);
async function jf(url) {
  const r = await to(15000, fetch(url));
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}
const cleanZ = z => String(z??'').replace(/\.0$/,'').replace(/\D/g,'').padStart(5,'0').slice(0,5);
const bdg = (t,c) => `<span class="bdg" style="background:${c}28;color:${c};border:1px solid ${c}50">${t}</span>`;
const qB  = v => v==='Yes'?bdg('YES','#6fb894'):v==='Unknown'?bdg('?','#d4a85c'):bdg('NO','#8b8f97');
const dB  = v => v==='Yes'?bdg('YES','#7f9bc0'):v==='Unknown'?bdg('?','#d4a85c'):bdg('NO','#8b8f97');
// Poverty rate badge — color thresholds:
//   ≤3%   = neon pink   (premium opportunity area)
//   ≤10%  = green        (low poverty, opportunity area)
//   ≤12%  = yellow       (borderline)
//   >12%  = red          (high poverty)
const pB  = (v, src) => {
  if (v === '' || v == null) return `<span class="dm" style="color:var(--dim)">—</span>`;
  const n = parseFloat(v);
  if (!isFinite(n)) return `<span class="dm" style="color:var(--dim)">—</span>`;
  const c = n <= 3  ? '#ff10f0'   // neon pink
          : n <= 10 ? '#6fb894'   // green
          : n <= 12 ? '#facc15'   // yellow
          :           '#ef4444';  // red
  const s = src ? String(src) : '';
  const esc = t => t.replace(/"/g,'&quot;');
  // Full source lives in the tooltip (and the CSV). Census = authoritative, no
  // marker; flag only the Living Atlas fallback with a small dim dot, since those
  // rows may differ from data.census.gov. Keeps the cell to a single line.
  const isCensus = /^Census/.test(s);
  const tip = s ? ` title="Source: ${esc(s)}${isCensus?'':' — may differ from data.census.gov'}"` : '';
  const dot = (s && !isCensus)
    ? `<span title="Source: ${esc(s)} — may differ from data.census.gov" style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);vertical-align:middle;margin-left:5px"></span>`
    : '';
  return `<span class="bdg"${tip} style="background:${c}28;color:${c};border:1px solid ${c}50">${n.toFixed(1)}%</span>${dot}`;
};
const etaS = n => { const s=n*.35; return s>90?`~${Math.ceil(s/60)} min left`:s>5?`~${Math.ceil(s)}s left`:'almost done'; };
const si   = s => s==='done'?`<span style="color:var(--green)">✓</span>`
                 :s==='run' ?`<span class="spin">◌</span>`
                 :s==='err' ?`<span style="color:var(--red)">✕</span>`
                 :`<span style="color:var(--border)">○</span>`;

function detectCols(headers) {
  const map = {};
  for (const [key, aliases] of Object.entries(ALIASES)) {
    map[key] = headers.find(h => aliases.includes(h.trim().toLowerCase())) || null;
  }
  return map;
}

function hasCoords(colMap, row) {
  if (!colMap.lat || !colMap.lon) return false;
  const lat = parseFloat(row[colMap.lat]);
  const lon = parseFloat(row[colMap.lon]);
  return isFinite(lat) && isFinite(lon);
}

// ── HUD SERVICES ──────────────────────────────────────────────────────────────
// Probe: just confirm the service is reachable (fast)
async function probeService(urls, stepId) {
  setS(stepId,'run');
  for (const url of urls) {
    try {
      const info = await to(9000, jf(`${url}?f=json`));
      if (!info.error && info.type === 'Feature Layer') {
        setS(stepId,'done','Service confirmed');
        return url;
      }
    } catch(e) { console.warn('probe fail',url,e.message); }
  }
  throw new Error(`Cannot reach HUD ${stepId.toUpperCase()} service. Check that services.arcgis.com is accessible.`);
}

// Full load: paginate all GEOIDs (only for geocoding mode)
async function loadQCTSet(url) {
  // Find the GEOID field name
  const info = await jf(`${url}?f=json`);
  if (info.error || !Array.isArray(info.fields)) throw new Error('Bad QCT service response');
  const fld = info.fields.find(f =>
    /^(GEOID|GEOID20|GEOID10|geoid|TRACT)$/i.test(f.name) ||
    (f.alias && /geoid/i.test(f.alias)) ||
    f.name.toUpperCase().startsWith('GEOID')
  )?.name;
  if (!fld) throw new Error('No GEOID field found in QCT service');

  const set = new Set();
  let off = 0, more = true;
  while (more) {
    const p = await jf(`${url}/query?where=1%3D1&outFields=${encodeURIComponent(fld)}&resultOffset=${off}&resultRecordCount=2000&f=json`);
    if (p.error) throw new Error(p.error.message);
    if (!p.features?.length) break;
    for (const f of p.features) {
      const g = f.attributes?.[fld];
      if (g) set.add(String(g).padStart(11,'0'));
    }
    more = !!p.exceededTransferLimit;
    off += p.features.length;
  }
  if (!set.size) throw new Error('QCT service returned zero records');
  return set;
}

// Spatial point query (used for both QCT and DDA when lat/lon available)
async function pointInService(serviceUrl, lon, lat) {
  const url = `${serviceUrl}/query?geometry=${lon}%2C${lat}&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&returnCountOnly=true&f=json`;
  const d = await to(12000, jf(url));
  if (d.error) throw new Error(d.error.message);
  return d.count > 0;
}

// ── GEOCODING (address mode only) ─────────────────────────────────────────────
async function geocodeAddr(street, city, state, zip) {
  const z = cleanZ(zip);
  const addr = [street, city, state, z].filter(Boolean).join(', ');
  if (!street || !city) return null;
  const d = await to(12000, jf(`${CENSUS_GEO}?address=${encodeURIComponent(addr)}&benchmark=Public_AR_Current&vintage=Census2020_Current&format=json`));
  const m = d.result?.addressMatches?.[0];
  if (!m) return null;
  const t = m.geographies?.['Census Tracts']?.[0];
  return {
    geoid: t ? String(t.GEOID).padStart(11,'0') : null,
    lat: m.coordinates?.y,
    lon: m.coordinates?.x,
  };
}

// Get census tract GEOID from lat/lon via FCC API (best-effort)
async function geoidFromCoords(lat, lon) {
  try {
    const d = await to(8000, jf(`${FCC_API}?latitude=${lat}&longitude=${lon}&censusYear=2020&format=json`));
    const fips = d?.Block?.FIPS;
    return fips ? String(fips).slice(0,11).padStart(11,'0') : null;
  } catch { return null; }
}

// ── POVERTY DATA (ESRI Living Atlas — ACS B17020 calc) ───────────────────────
// Point-in-polygon query against the ACS poverty tracts layer. Identical
// pattern to pointInService for QCT/DDA — same host (services.arcgis.com),
// same CORS posture, works fine from file:// pages.
async function pointPoverty(serviceUrl, lon, lat) {
  const url = `${serviceUrl}/query`
    + `?geometry=${lon}%2C${lat}`
    + `&geometryType=esriGeometryPoint`
    + `&inSR=4326`
    + `&spatialRel=esriSpatialRelIntersects`
    + `&outFields=${POVERTY_FIELD}`
    + `&returnGeometry=false`
    + `&f=json`;
  const d = await to(12000, jf(url));
  if (d.error) throw new Error(d.error.message);
  const v = d.features?.[0]?.attributes?.[POVERTY_FIELD];
  if (v == null) return null;
  const n = parseFloat(v);
  // Living Atlas sets negative sentinels (-4444, etc.) to null already and
  // -5555 to zero. We still belt-and-suspenders the range check.
  return (isFinite(n) && n >= 0 && n <= 100) ? n : null;
}

// Attribute query keyed on the canonical tract GEOID. This is the authoritative
// lookup: it returns the poverty rate for the EXACT tract shown in the GEOID
// column, so the percentage can never come from a neighbouring polygon the way a
// raw point-in-polygon query can. The GEOID is resolved separately (FCC API in
// coordinate mode, Census geocoder in address mode), both 2020-vintage tracts —
// which matches this layer's 2020-based TIGER boundaries.
// We pull the calc percent AND the raw counts so we can (a) fall back to
// computing 100*B17020_002E/B17020_001E if the calc field is null, and (b) flag
// statistically unreliable tracts (very small universe / suppressed values) —
// exactly the S1701 "population for whom poverty status is determined" universe.
async function tractPovertyByGeoid(serviceUrl, geoid) {
  if (!geoid) return null;
  const g = String(geoid).padStart(11, '0').slice(0, 11);
  const url = `${serviceUrl}/query`
    + `?where=${encodeURIComponent(`GEOID='${g}'`)}`
    + `&outFields=${encodeURIComponent(`${POVERTY_FIELD},B17020_001E,B17020_002E`)}`
    + `&returnGeometry=false`
    + `&f=json`;
  const d = await to(12000, jf(url));
  if (d.error) throw new Error(d.error.message);
  const a = d.features?.[0]?.attributes;
  if (!a) return null;                       // GEOID not present in this layer
  let n = parseFloat(a[POVERTY_FIELD]);
  if (!isFinite(n)) {                         // calc field suppressed → derive it
    const tot = parseFloat(a.B17020_001E);
    const pov = parseFloat(a.B17020_002E);
    n = (isFinite(tot) && tot > 0 && isFinite(pov)) ? (100 * pov / tot) : NaN;
  }
  return (isFinite(n) && n >= 0 && n <= 100) ? n : null;
}

// Authoritative poverty lookup straight from the Census Data API for an explicit
// ACS 5-year release. Splits the 11-digit GEOID into state(2)/county(3)/tract(6)
// and pulls S1701_C03_001E — the exact "Percent below poverty level" published on
// data.census.gov. Returns { rate, year } so the UI can show which release it is.
// Tries the requested year, then steps back up to 2 releases if that tract isn't
// in the newest vintage yet. Returns null on any failure (caller falls back to
// the ESRI layer). Requires a Census API key (mandatory since 2026-05-12).
async function censusTractPoverty(geoid, year, key) {
  if (!geoid || !key) return null;
  const g = String(geoid).padStart(11, '0').slice(0, 11);
  const st = g.slice(0, 2), co = g.slice(2, 5), tr = g.slice(5, 11);
  const yr = parseInt(year, 10) || CENSUS_DEFAULT_YEAR;
  for (let y = yr; y >= yr - 2; y--) {
    const url = `${CENSUS_API}/${y}/${CENSUS_DATASET}`
      + `?get=${CENSUS_PCT_VAR}`
      + `&for=tract:${tr}`
      + `&in=${encodeURIComponent(`state:${st} county:${co}`)}`
      + `&key=${encodeURIComponent(key)}`;
    let rows;
    try {
      rows = await to(12000, jf(url));   // [[header...],[values...]]
    } catch (e) {
      // Auth/format errors won't fix themselves on an older year — stop early.
      if (/HTTP 4\d\d/.test(e.message)) throw e;
      continue;                          // transient/timeout → try previous year
    }
    const val = Array.isArray(rows) && rows[1] ? parseFloat(rows[1][0]) : NaN;
    // Census uses large negative sentinels (e.g. -666666666) for suppressed cells.
    if (isFinite(val) && val >= 0 && val <= 100) return { rate: val, year: y };
  }
  return null;
}

// Resolve a row's poverty rate from the most authoritative source available.
// Priority: 1) Census Data API (exact data.census.gov match, needs key + GEOID),
//           2) ESRI Living Atlas keyed to that GEOID, 3) ESRI point-in-polygon.
// Returns { rate:Number|null, source:String }.
async function resolvePoverty(geoid, lon, lat, label, warn) {
  if (geoid && S.censusKey) {
    try {
      const c = await censusTractPoverty(geoid, S.censusYear, S.censusKey);
      if (c) return { rate: c.rate, source: `Census ACS ${c.year - 4}–${c.year}` };
    } catch (e) { warn.push(`${label}: Census API — ${e.message} (falling back)`); }
  }
  if (geoid) {
    const r = await tractPovertyByGeoid(S.povertyUrl, geoid)
      .catch(e => { warn.push(`${label}: Poverty (GEOID) — ${e.message}`); return null; });
    if (r != null) return { rate: r, source: 'Living Atlas (tract)' };
  }
  if (isFinite(lat) && isFinite(lon)) {
    const r = await pointPoverty(S.povertyUrl, lon, lat)
      .catch(e => { warn.push(`${label}: Poverty (point fallback) — ${e.message}`); return null; });
    if (r != null) return { rate: r, source: 'Living Atlas (point)' };
  }
  return { rate: null, source: '' };
}

// ── PROCESSING ────────────────────────────────────────────────────────────────
async function runScan() {
  const { csvRows, colMap } = S;
  const coordMode = colMap.lat && colMap.lon;

  S.results = []; S.warnings = [];

  // Geocoding mode needs the QCT set loaded first
  if (!coordMode && !S.qctSet) {
    S.phase = 'loading-qct';
    S.prog  = { n:0, total:0, label:'Loading 2026 QCT designations…', eta:'' };
    render();
    try {
      S.qctSet = await loadQCTSet(S.qctUrl);
      setS('qct','done',`${S.qctSet.size.toLocaleString()} QCT tracts (2026)`);
    } catch(e) {
      S.initErr = e.message; S.phase = 'error'; render(); return;
    }
  }

  S.phase = 'processing';
  S.prog  = { n:0, total:csvRows.length, label:'Starting…', eta:'' };
  render();

  const out = [], warn = [];

  for (let i = 0; i < csvRows.length; i++) {
    const row = { ...csvRows[i] };
    const label = row[colMap.name] || row[colMap.street] || `Row ${i+1}`;
    S.prog = { n:i+1, total:csvRows.length, label, eta:etaS(csvRows.length - i) };
    render();

    // ── Coordinate mode: use lat/lon directly ─────────────────────────
    if (coordMode) {
      const lat = parseFloat(row[colMap.lat]);
      const lon = parseFloat(row[colMap.lon]);

      if (!isFinite(lat) || !isFinite(lon)) {
        row['Census Tract GEOID'] = '';
        row['Geocode Status']     = 'no coords';
        row['QCT']                = 'Unknown';
        row['DDA (Live)']         = 'Unknown';
        row['Poverty Rate (%)']   = '';
        row['Poverty Source']     = '';
      } else {
        // Resolve the canonical tract GEOID first; QCT/DDA are independent point
        // queries so they can still run alongside it.
        const [isQCT, isDDA, geoid] = await Promise.all([
          pointInService(S.qctUrl, lon, lat).catch(e => { warn.push(`${label}: QCT — ${e.message}`); return null; }),
          pointInService(S.ddaUrl, lon, lat).catch(e => { warn.push(`${label}: DDA — ${e.message}`); return null; }),
          geoidFromCoords(lat, lon),  // census tract GEOID (FCC, 2020 vintage)
        ]);
        // Poverty is keyed to that GEOID so it always matches the tract shown,
        // pulled from the most authoritative source available (Census API first).
        const pov = await resolvePoverty(geoid, lon, lat, label, warn);
        row['Census Tract GEOID'] = geoid ?? '';
        row['Geocode Status']     = 'coordinates';
        row['QCT']                = isQCT  === null ? 'Unknown' : isQCT  ? 'Yes' : 'No';
        row['DDA (Live)']         = isDDA  === null ? 'Unknown' : isDDA  ? 'Yes' : 'No';
        row['Poverty Rate (%)']   = pov.rate === null ? '' : pov.rate.toFixed(1);
        row['Poverty Source']     = pov.source;
      }

    // ── Geocoding mode: use address ────────────────────────────────────
    } else {
      let geo = null;
      try {
        geo = await geocodeAddr(
          row[colMap.street] || '',
          row[colMap.city]   || '',
          row[colMap.state]  || '',
          row[colMap.zip]    || ''
        );
      } catch(e) { warn.push(`${label}: geocode — ${e.message}`); }

      if (geo) {
        const isQCT = geo.geoid ? S.qctSet.has(geo.geoid) : null;
        let isDDA = null, pov = { rate: null, source: '' };
        if (geo.lat != null && geo.lon != null) {
          // DDA stays a point query; poverty is keyed to the geocoder's tract
          // GEOID (Census API first, then ESRI), so it matches the tract shown.
          isDDA = await pointInService(S.ddaUrl, geo.lon, geo.lat)
            .catch(e => { warn.push(`${label}: DDA — ${e.message}`); return null; });
          pov = await resolvePoverty(geo.geoid, geo.lon, geo.lat, label, warn);
        }
        row['Census Tract GEOID'] = geo.geoid ?? '';
        row['Geocode Status']     = 'matched';
        row['QCT']                = isQCT === null ? 'Unknown' : isQCT ? 'Yes' : 'No';
        row['DDA (Live)']         = isDDA === null ? 'Unknown' : isDDA ? 'Yes' : 'No';
        row['Poverty Rate (%)']   = pov.rate === null ? '' : pov.rate.toFixed(1);
        row['Poverty Source']     = pov.source;
      } else {
        row['Census Tract GEOID'] = '';
        row['Geocode Status']     = 'unmatched';
        row['QCT']                = 'Unknown';
        row['DDA (Live)']         = 'Unknown';
        row['Poverty Rate (%)']   = '';
        row['Poverty Source']     = '';
      }
    }

    out.push(row);
    await sleep(coordMode ? 50 : 75);  // coord mode is faster, needs less throttling
  }

  S.results = out; S.warnings = warn; S.phase = 'done'; render();
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function setS(id,st,note='') { S.steps=S.steps.map(s=>s.id===id?{...s,st,note}:s); render(); }
function getFiltered() {
  const f = S.filter;
  const list = S.results.filter(r => {
    const pov = parseFloat(r['Poverty Rate (%)']);
    return f==='qct'   ? r.QCT==='Yes' :
           f==='dda'   ? r['DDA (Live)']==='Yes' :
           f==='both'  ? r.QCT==='Yes' && r['DDA (Live)']==='Yes' :
           f==='povlo' ? isFinite(pov) && pov <= 10 :
           f==='povhi' ? isFinite(pov) && pov > 12 :
           f==='miss'  ? ['unmatched','no coords'].includes(r['Geocode Status']) : true;
  });
  if (S.sort && (S.sort.dir === 'asc' || S.sort.dir === 'desc')) {
    const dir = S.sort.dir === 'asc' ? 1 : -1;
    const acCol = S.colMap.acres, prCol = S.colMap.price,
          coCol = S.colMap.county, znCol = S.colMap.zoning, puCol = S.colMap.propuse;
    // For numeric sorts (poverty / acres / price) we strip non-numerics and
    // compare as numbers; non-numeric values fall to the bottom. County and
    // zoning are string sorts — compared lexicographically, case-insensitive
    // — and rows with a blank value fall to the bottom in either direction.
    const valOf = r => {
      if (S.sort.key === 'poverty') return parseFloat(r['Poverty Rate (%)']);
      if (S.sort.key === 'acres' && acCol)
        return parseFloat(String(r[acCol] ?? '').replace(/[^\d.\-]/g,''));
      if (S.sort.key === 'price' && prCol)
        return parseFloat(String(r[prCol] ?? '').replace(/[^\d.\-]/g,''));
      return NaN;
    };
    // Resolve which column drives a string sort, if any.
    const strCol = S.sort.key === 'county' ? coCol
                 : S.sort.key === 'zoning' ? znCol
                 : S.sort.key === 'propuse' ? puCol
                 : null;
    if (strCol) {
      // String-sort branch (county or zoning). Blanks always at the bottom.
      list.sort((a, b) => {
        const sa = String(a[strCol] ?? '').trim().toLowerCase();
        const sb = String(b[strCol] ?? '').trim().toLowerCase();
        if (!sa && !sb) return 0;
        if (!sa) return 1;
        if (!sb) return -1;
        return sa.localeCompare(sb) * dir;
      });
    } else {
      // Numeric sort: missing/non-finite values always sort to the bottom.
      list.sort((a,b) => {
        const va = valOf(a), vb = valOf(b);
        const fa = isFinite(va), fb = isFinite(vb);
        if (!fa && !fb) return 0;
        if (!fa) return 1;
        if (!fb) return -1;
        return (va - vb) * dir;
      });
    }
  }
  return list;
}
// Cycle sort for a given column: none → asc → desc → none.
// Clicking a different column starts that column fresh at asc.
function setSort(key) {
  if (!key) key = 'poverty';
  if (!S.sort || S.sort.key !== key)      S.sort = {key, dir:'asc'};
  else if (S.sort.dir === 'asc')          S.sort = {key, dir:'desc'};
  else                                     S.sort = null;
  render();
}

      ${banner}

      <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">
        ADDRESS COLUMNS ${hasLatLon?'<span style="color:var(--dim);font-weight:400">(optional in coordinate mode)</span>':''}
      </div>
      <div class="cmg" style="margin-bottom:22px">${ADDR_FIELDS.map(fieldRow).join('')}</div>

      <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">
        COORDINATE COLUMNS <span style="color:var(--blue);font-weight:400">(enables faster spatial mode)</span>
      </div>
      <div class="cmg" style="margin-bottom:22px">${COORD_FIELDS.map(fieldRow).join('')}</div>

      <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">
        PROPERTY DETAILS <span style="color:var(--dim);font-weight:400">(optional pass-through columns)</span>
      </div>
      <div class="cmg" style="margin-bottom:22px">${DETAIL_FIELDS.map(fieldRow).join('')}</div>

      <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.1em;margin-bottom:10px">
        POVERTY DATA SOURCE <span style="color:var(--dim);font-weight:400">(optional — for exact data.census.gov match)</span>
      </div>
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:22px">
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <div style="flex:1;min-width:240px">
            <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:5px">Census API key</label>
            <input type="text" value="${(S.censusKey||'').replace(/"/g,'&quot;')}" placeholder="paste your free key (40 hex chars)"
              oninput="upCensusKey(this.value)"
              style="width:100%;background:var(--deep);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:12px;padding:8px 10px">
          </div>
          <div style="width:120px">
            <label style="display:block;font-size:11px;color:var(--dim);margin-bottom:5px">ACS 5-yr release</label>
            <input type="number" min="2009" max="2030" step="1" value="${S.censusYear}"
              oninput="upCensusYear(this.value)"
              style="width:100%;background:var(--deep);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:monospace;font-size:12px;padding:8px 10px">
          </div>
        </div>
        ${S.censusKey?`<div style="display:flex;align-items:center;gap:10px;margin-top:10px">
          <span style="font-size:11px;color:var(--green)">✓ Key saved on this device — it'll auto-fill next time.</span>
          <button class="btn bg" style="padding:4px 12px;font-size:11px" onclick="forgetCensusKey()">Forget key</button>
        </div>`:''}
        <div style="font-size:11px;color:var(--dim);line-height:1.6;margin-top:10px">
          With a key, poverty is pulled straight from the Census Data API (table S1701, variable
          S1701_C03_001E) for the chosen release — the exact figure shown on data.census.gov.
          The Census Bureau has required a key on every request since May 2026;
          <a href="https://api.census.gov/data/key_signup.html" target="_blank" rel="noopener" style="color:var(--blue)">get one free here</a>.
          Leave blank to use the ESRI Living Atlas layer instead (its release can lag the site by a year).
          ${location.protocol==='file:'?'<br><span style="color:var(--amber)">Note: you\'re running from a file:// page. If the Census call is blocked, the scanner falls back automatically — serve the file over http(s):// for the direct Census lookup.</span>':''}
        </div>
      </div>

      ${pvCols.length?`
        <div style="font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em;margin-bottom:8px">DATA PREVIEW (first 3 rows)</div>
        <div class="pvw"><table><thead><tr>${pvHead}</tr></thead><tbody>${pvBody}</tbody></table></div>
      `:''}

      ${!canScan?`<div class="warn" style="margin-bottom:16px">
        ⚠ Either map Latitude+Longitude <em>or</em> map Street, City, and State to proceed.
      </div>`:''}

      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn bg" style="padding:6px 14px;font-size:12px" onclick="goReady()">← Back</button>
        <button class="btn bp" style="padding:6px 18px;font-size:12px;${canScan?'':'opacity:.35;cursor:not-allowed'}"
          onclick="${canScan?'runScan()':'void 0'}">
          ${hasLatLon?'⚡ Scan with Coordinates':'Scan'} ${csvRows.length.toLocaleString()} Properties →
        </button>
        ${hasLatLon?`<span style="font-size:11px;color:var(--blue)">~${Math.ceil(csvRows.length*.35/60)} min est.</span>`:''}
      </div>
    </div></div>`; return;
  }

  // ── LOADING QCT (geocoding mode pre-step) ─────────────────────────────
  if (phase==='loading-qct') {
    M.innerHTML=`<div class="fu" style="max-width:520px;margin:60px auto"><div class="card">
      <div class="slbl">LOADING QCT DATA</div>
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
        <span class="spin" style="font-size:20px">◌</span>
        <span style="font-family:'Hanken Grotesk',monospace;font-size:13px;color:var(--dim)">${prog.label}</span>
      </div>
      <div style="font-size:12px;color:var(--dim)">
        Loading all 2026 QCT census tract designations from HUD ArcGIS for geocoding mode…
      </div>
    </div></div>`; return;
  }

  // ── PROCESSING ──────────────────────────────────────────────────────────
  if (phase==='processing') {
    const coordMode2 = S.colMap.lat && S.colMap.lon;
    M.innerHTML=`<div class="fu" style="max-width:520px;margin:60px auto"><div class="card">
      <div class="slbl">SCANNING PROPERTIES</div>
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
        <span style="color:var(--dim)">${prog.n.toLocaleString()} of ${prog.total.toLocaleString()}</span>
        <span style="font-family:'Hanken Grotesk',monospace;color:var(--green)">${pct}%</span>
      </div>
      <div class="pt"><div class="pf" style="width:${pct}%"></div></div>
      <div class="pm" style="margin-bottom:18px">
        <span class="pl">→ ${prog.label}</span>
        <span>${prog.eta}</span>
      </div>
      <div style="font-size:12px;color:var(--dim);line-height:1.7;padding-top:14px;border-top:1px solid var(--muted)">
        ${coordMode2
          ? '⚡ Coordinate mode — QCT, DDA &amp; Poverty spatial queries from lat/lon · FCC census tract lookup'
          : 'Geocoding via US Census Bureau · QCT from preloaded set · DDA &amp; Poverty spatial queries'}
      </div>
    </div></div>`; return;
  }

  // ── DONE ────────────────────────────────────────────────────────────────
  if (phase==='done') {
    const wH = warnings.length
      ? `<div class="warn">⚠ <strong>${warnings.length} issue${warnings.length===1?'':'s'}</strong> during scanning — affected rows show Unknown.</div>`
      : '';
    const fBtns = [
      {id:'all',   l:`All (${results.length})`},
      {id:'qct',   l:`QCT (${qN})`},
      {id:'dda',   l:`DDA (${dN})`},
      {id:'both',  l:`QCT+DDA (${bN})`},
      {id:'povlo', l:`Low Pov ≤10% (${pLoN})`},
      {id:'povhi', l:`High Pov >12% (${pHiN})`},
      {id:'miss',  l:`Failed (${results.length-mN})`},
    ].map(f=>`<button class="tab ${filter===f.id?'on':''}" onclick="setF('${f.id}')">${f.l}</button>`).join('');

    const nm=colMap.name, st=colMap.street, ct=colMap.city, ss=colMap.state;
    const ac=colMap.acres, pr=colMap.price, co=colMap.county, zn=colMap.zoning, pu=colMap.propuse;
    // Format acreage: numeric → "3.42 ac"; passthrough strings as-is.
    const fmtAc = v => {
      if (v === '' || v == null) return '—';
      const n = parseFloat(String(v).replace(/,/g,''));
      return isFinite(n) ? `${n.toFixed(2)} ac` : String(v);
    };
    // Format price: numeric → "$2.0M" / "$750K" / "$500"; non-numeric (e.g.
    // CoStar's "Not Disclosed") passes through dimmed. Empty → em-dash.
    const fmtPr = v => {
      if (v === '' || v == null) return '<span style="color:var(--dim)">—</span>';
      const n = parseFloat(String(v).replace(/[^\d.\-]/g,''));
      if (!isFinite(n)) return `<span style="color:var(--dim);font-size:11px">${String(v)}</span>`;
      if (n >= 1e6) return `$${(n/1e6).toFixed(n>=1e7?1:2)}M`;
      if (n >= 1e3) return `$${Math.round(n/1e3)}K`;
      return `$${n.toLocaleString()}`;
    };
    const totalCols = 8 + (ac?1:0) + (pr?1:0) + (co?1:0) + (zn?1:0) + (pu?1:0);
    const tR = rows.length===0
      ? `<tr><td colspan="${totalCols}" style="padding:36px;text-align:center;color:var(--dim)">No properties match this filter</td></tr>`
      : rows.map(r=>`<tr>
          <td class="dn" title="${r[nm]||''}">${r[nm]||'—'}</td>
          <td class="dd">${(st&&r[st])||'—'}</td>
          <td class="dc">${(ct&&r[ct])||''}${ss&&r[ss]?', '+r[ss]:''}</td>
          ${co?`<td class="dc">${r[co]||'<span style="color:var(--dim)">—</span>'}</td>`:''}
          ${ac?`<td class="dm" style="color:var(--text)">${fmtAc(r[ac])}</td>`:''}
          ${pr?`<td class="dm" style="color:var(--text);font-weight:500" title="${r[pr]||''}">${fmtPr(r[pr])}</td>`:''}
          ${zn?`<td class="dz" title="${r[zn]||''}">${r[zn]||'<span style="color:var(--dim)">—</span>'}</td>`:''}
          ${pu?`<td class="dpu" title="${r[pu]||''}">${r[pu]||'<span style="color:var(--dim)">—</span>'}</td>`:''}
          <td>${qB(r.QCT)}</td>
          <td>${dB(r['DDA (Live)'])}</td>
          <td>${pB(r['Poverty Rate (%)'], r['Poverty Source'])}</td>
          <td class="dm">${r['Census Tract GEOID']||'—'}</td>
          <td>${r['Geocode Status']==='matched'||r['Geocode Status']==='coordinates'
            ?`<span class="ok">● ${r['Geocode Status']}</span>`
            :`<span class="fail">○ ${r['Geocode Status']}</span>`}</td>
        </tr>`).join('');

    M.innerHTML=`<div class="fu">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">
        ${[['Total',results.length,'var(--text)'],['Scanned',mN,'var(--text)'],
           ['QCT',qN,'var(--green)'],['DDA',dN,'var(--blue)'],['QCT+DDA',bN,'var(--amber)'],
           ['Pov ≤10%',pLoN,pLoN>0?'#6fb894':'var(--dim)'],
           ['Pov >12%',pHiN,pHiN>0?'#ef4444':'var(--dim)'],
           ['Failed',results.length-mN,results.length-mN>0?'var(--red)':'var(--dim)']
          ].map(([l,v,c])=>`<div class="sc"><div class="sv" style="color:${c}">${v}</div><div class="sll">${l.toUpperCase()}</div></div>`
        ).join('')}
      </div>
      ${wH}
      <div class="tabs">${fBtns}<span class="fc">${rows.length.toLocaleString()} showing</span></div>
      <div class="tw"><div class="ts">
        <table class="rt">
          <thead><tr>
            <th style="min-width:180px">PROPERTY</th>
            <th style="min-width:150px">STREET</th>
            <th style="min-width:110px">CITY/STATE</th>
            ${co?`<th style="min-width:100px;cursor:pointer;user-select:none" onclick="setSort('county')" title="Click to sort by county name (A→Z, Z→A, off)">COUNTY${S.sort&&S.sort.key==='county'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='county'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>`:''}
            ${ac?`<th style="min-width:80px;cursor:pointer;user-select:none" onclick="setSort('acres')" title="Click to sort by acreage (asc → desc → off)">ACRES${S.sort&&S.sort.key==='acres'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='acres'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>`:''}
            ${pr?`<th style="min-width:90px;cursor:pointer;user-select:none" onclick="setSort('price')" title="Click to sort by sale price (asc → desc → off). Non-numeric values (e.g. Not Disclosed) sort to the bottom.">PRICE${S.sort&&S.sort.key==='price'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='price'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>`:''}
            ${zn?`<th style="min-width:70px;cursor:pointer;user-select:none" onclick="setSort('zoning')" title="Click to sort by zoning code (A→Z, Z→A, off)">ZONING${S.sort&&S.sort.key==='zoning'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='zoning'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>`:''}
            ${pu?`<th style="min-width:200px;cursor:pointer;user-select:none" onclick="setSort('propuse')" title="Proposed land use passed through from CoStar. Click to sort (A→Z, Z→A, off)">PROPOSED USE${S.sort&&S.sort.key==='propuse'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='propuse'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>`:''}
            <th style="min-width:65px">QCT</th>
            <th style="min-width:65px">DDA</th>
            <th style="min-width:90px;cursor:pointer;user-select:none" onclick="setSort('poverty')" title="Click to sort by poverty rate (asc → desc → off)">POVERTY %${S.sort&&S.sort.key==='poverty'&&S.sort.dir==='asc'?' <span style="color:var(--green)">▲</span>':S.sort&&S.sort.key==='poverty'&&S.sort.dir==='desc'?' <span style="color:var(--green)">▼</span>':' <span style="color:var(--dim);opacity:.5">⇅</span>'}</th>
            <th style="min-width:135px">CENSUS TRACT GEOID</th>
            <th style="min-width:105px">STATUS</th>
          </tr></thead>
          <tbody>${tR}</tbody>
        </table>
      </div></div>
      <div class="foot">Source: HUD 2026 QCT/DDA via ArcGIS · 2020 Census boundaries · FCC census tract API · Poverty rate looked up by the tract GEOID shown in each row — from the Census Data API (table S1701, var S1701_C03_001E, the exact data.census.gov figure) when a key is supplied, otherwise the ESRI Living Atlas ACS 5-Year layer; the per-row source is shown under each poverty badge · Acres / Sale Price / County / Zoning / Proposed Use passed through from source CSV</div></div>
    </div>`;
  }
}

// ── EVENTS ────────────────────────────────────────────────────────────────────
function initDZ() {
  const dz=document.getElementById('dz'), fi=document.getElementById('fi');
  if (!dz) return;
  const ov = () => { dz.style.borderColor='var(--green)'; dz.style.background='rgba(111,184,148,.06)'; };
  const ou = () => { dz.style.borderColor='var(--border)'; dz.style.background='var(--surf)'; };
  dz.addEventListener('dragover',  e => { e.preventDefault(); ov(); });
  dz.addEventListener('dragleave', ou);
  dz.addEventListener('drop',      e => { e.preventDefault(); ou(); openCSV(e.dataTransfer.files[0]); });
  dz.addEventListener('click',     () => fi.click());
  fi.addEventListener('change',    e => { openCSV(e.target.files?.[0]); fi.value=''; });
}

function openCSV(file) {
  if (!file?.name.endsWith('.csv')) return;

  // Parse as raw arrays first so we can detect the real header row.
  // Crexi exports have 1-2 junk rows at the top (blank + count) before the actual headers.
  Papa.parse(file, {
    header: false,
    skipEmptyLines: false,   // keep blank rows so indices are stable
    complete(res) {
      const raw = res.data;

      // Cells in a real header row will match these known column names
      const HINTS = new Set([
        'property link','property name','property status','address','street','city','state',
        'zip','zipcode','latitude','longitude','lat','lon','lng','type','name',
        'price','sqft','units','acres','lot size'
      ]);

      // Score each row: count how many cells match known column names
      let headerIdx = 0, bestScore = 0;
      for (let i = 0; i < Math.min(10, raw.length); i++) {
        const score = raw[i].filter(c => HINTS.has(String(c||'').trim().toLowerCase())).length;
        if (score > bestScore) { bestScore = score; headerIdx = i; }
      }

      // Build headers array (trim whitespace, keep original casing)
      const headers = raw[headerIdx].map(h => String(h ?? '').trim());

      // Convert data rows to objects
      const objRows = raw.slice(headerIdx + 1)
        .filter(r => r.some(c => c != null && String(c).trim() !== ''))
        .map(row => {
          const obj = {};
          headers.forEach((h, i) => { if (h) obj[h] = row[i] != null ? String(row[i]) : ''; });
          return obj;
        });

      S.csvRows = objRows;
      S.csvCols = headers.filter(h => h);
      S.colMap  = detectCols(S.csvCols);
      S.phase   = 'mapping';
      render();
    }
  });
}

function upMap(k,v) { S.colMap[k] = v==='(none)'?null:v; render(); }
// Don't re-render on key input — that would steal focus mid-type. Just store it.
// Persistence uses localStorage, wrapped so it silently no-ops where storage is
// unavailable or blocked (e.g. some sandboxed/file:// contexts).
const LS_CKEY = 'lihtc.censusKey', LS_CYEAR = 'lihtc.censusYear';
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }
function loadSavedCensus(){
  const k = lsGet(LS_CKEY); if (k) S.censusKey = k;
  const y = parseInt(lsGet(LS_CYEAR), 10); if (isFinite(y)) S.censusYear = y;
}
function upCensusKey(v){
  S.censusKey = (v||'').trim();
  if (S.censusKey) lsSet(LS_CKEY, S.censusKey); else lsDel(LS_CKEY);
}
function upCensusYear(v){
  const y = parseInt(v,10);
  if (isFinite(y)) { S.censusYear = y; lsSet(LS_CYEAR, String(y)); }
}
function forgetCensusKey(){ S.censusKey=''; lsDel(LS_CKEY); render(); }
function goReady()   { S.phase='ready'; render(); }
function resetScan() { S.results=[]; S.warnings=[]; S.filter='all'; S.sort=null; S.qctSet=null; S.phase='ready'; render(); }
function setF(f)     { S.filter=f; render(); }

// ── BOOT ──────────────────────────────────────────────────────────────────────
loadSavedCensus();   // restore a previously saved Census key + release year
render();
(async () => {
  try {
    const [qctUrl, ddaUrl, povertyUrl] = await Promise.all([
      probeService(QCT_URLS, 'qct'),
      probeService(DDA_URLS, 'dda'),
      probeService(POVERTY_URLS, 'poverty'),
    ]);
    S.qctUrl     = qctUrl;
    S.ddaUrl     = ddaUrl;
    S.povertyUrl = povertyUrl;
    S.phase      = 'ready';
    render();
  } catch(e) {
    S.initErr = e.message;
    S.phase   = 'error';
    render();
  }
})();
</script>
